spring.application.name=unibolos

# Carrega as variáveis do arquivo .env na raiz do projeto
spring.config.import=optional:file:./.env[.properties]

# Conexão com PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:unibolos}
spring.datasource.username=${POSTGRES_USER:unibolos}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
